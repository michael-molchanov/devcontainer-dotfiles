set -g mouse on            # Enable mouse for scrolling/resizing
set -g base-index 1        # Start window numbering at 1
set -g pane-base-index 1   # Start pane numbering at 1

set -g monitor-activity on
set -g visual-activity on

# Enable extended keys for all panes
set -g extended-keys always

# Tell tmux your terminal supports extended keys (replace 'xterm*' with your actual $TERM if needed)
set -as terminal-features ',xterm*:extkeys'

# Let tmux set the outside terminal's clipboard via OSC 52
set -s set-clipboard on

# Tell tmux that your terminal supports the Ms (clipboard) capability
# Use 'tmux-256color' or whatever $TERM shows outside tmux
set -as terminal-features ',xterm*:clipboard'

# tmux 3.3+: allow passthrough of escape sequences from inner apps (e.g. nvim)
set -g allow-passthrough on

# Set terminal to support 256 colors
set -g default-terminal "tmux-256color"

# Enable RGB/True Color support (replace 'xterm*' with your terminal's $TERM, usually xterm-256color)
set-option -a terminal-features 'xterm-256color:RGB'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_text " #T => #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #T => #{b:pane_current_path}"

run '${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tmux/catppuccin.tmux' 

set -g status-left-length 150
set -g status-right-length 150

set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"

set -ag status-right "#[bg=#{@thm_flamingo},fg=#{@thm_crust}]#[reverse]#[noreverse]󱀙  "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #{ram_percentage} "

set -agF status-right "#{E:@catppuccin_status_load}"

set -ag status-right "#{E:@catppuccin_status_session}"

# List of plugins
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm'
